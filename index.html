<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1f1c">
<title>Взрывные лемуры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: a night-jungle game table. Players' seats on top, deck + discard + fuse meter in the arena, your hand docked at the bottom as a fan, party log on the side. Single deliberate dark theme. */
:root {
  color-scheme: dark;
  --bg: #0a1f1c;
  --bg-2: #0e2a25;
  --surface: #12352f;
  --surface-2: #184239;
  --line: #24584c;
  --ink: #fff8ec;
  --muted: #9fc3b8;
  --mango: #ffb22e;
  --mango-deep: #e0820e;
  --coral: #ff5d4a;
  --cream: #fff3dc;
  --cocoa: #2a1708;
  --display: "Rubik", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cw: 138px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse 90% 60% at 50% 0%, #1d5a49 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%, #3a2410 0%, transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; font-weight: 700;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}
body::before {
  /* jungle canopy silhouettes */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .55;
  background:
    radial-gradient(60px 120px at 0% 10%, #05140f 60%, transparent 61%),
    radial-gradient(90px 60px at 6% 0%, #05140f 60%, transparent 61%),
    radial-gradient(70px 130px at 100% 20%, #05140f 60%, transparent 61%),
    radial-gradient(110px 70px at 94% 0%, #05140f 60%, transparent 61%);
}
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--mango); outline-offset: 2px; }
input, select {
  font: inherit; color: var(--ink); background: var(--bg-2); border: 2px solid var(--line);
  border-radius: 14px; padding: 12px 14px; min-width: 0;
}
input::placeholder { color: #6f978b; }
[hidden] { display: none !important; }
.wrap { max-width: 1160px; margin: 0 auto; display: grid; gap: 18px; }
.muted { color: var(--muted); }
.label { font-family: var(--display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }

/* buttons */
.btn {
  --b: var(--surface-2);
  background: var(--b); border: 0; border-radius: 16px; padding: 12px 20px;
  font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .01em;
  box-shadow: 0 4px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { --b: linear-gradient(180deg, #ffc64f, var(--mango-deep)); color: var(--cocoa); box-shadow: 0 4px 0 #8a4d00, inset 0 1px 0 rgba(255,255,255,.5); }
.btn.danger { --b: linear-gradient(180deg, #ff7a63, #d9321f); color: #fff; box-shadow: 0 4px 0 #7a1608, inset 0 1px 0 rgba(255,255,255,.35); }
.btn.big { font-size: 18px; padding: 16px 26px; border-radius: 18px; }
.btn.ghost { --b: transparent; box-shadow: inset 0 0 0 2px var(--line); }

/* logo */
.logo { font-family: var(--display); font-weight: 900; line-height: .9; letter-spacing: -.01em; text-transform: uppercase; display: inline-grid; }
.logo span { display: block; color: var(--mango); -webkit-text-stroke: 0; text-shadow: 0 3px 0 #8a4d00, 0 6px 0 rgba(0,0,0,.35); }
.logo span:first-child { color: var(--cream); text-shadow: 0 3px 0 #6d4a26, 0 6px 0 rgba(0,0,0,.35); font-size: .62em; letter-spacing: .08em; }
.logo span:last-child { transform: rotate(-3deg); transform-origin: left; }

/* lobby */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 20px; align-items: center; padding-block: 10px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; text-align: center; justify-items: center; } }
.hero .logo { font-size: clamp(44px, 9vw, 92px); }
.hero p { max-width: 52ch; margin: 14px 0 0; color: var(--muted); font-size: 16px; font-weight: 700; }
.hero-art { position: relative; width: min(340px, 80vw); aspect-ratio: 1; justify-self: center; }
.hero-art .halo { position: absolute; inset: 6%; border-radius: 50%; background: radial-gradient(circle, #ffcf6b 0%, #ff8a2a 45%, transparent 70%); filter: blur(6px); opacity: .55; animation: pulse 3s ease-in-out infinite; }
.hero-art svg { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 18px 24px rgba(0,0,0,.5)); animation: bob 3.2s ease-in-out infinite; }
.hero-art .mini { position: absolute; width: 34%; filter: drop-shadow(0 8px 10px rgba(0,0,0,.5)); }
.hero-art .mini.a { left: -6%; bottom: 2%; transform: rotate(-14deg); }
.hero-art .mini.b { right: -6%; bottom: 6%; transform: rotate(12deg); }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-1.5deg); } }
@keyframes pulse { 50% { opacity: .8; transform: scale(1.05); } }
.lobby-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 760px) { .lobby-grid { grid-template-columns: 1fr; } }
.panel {
  background: linear-gradient(180deg, var(--surface-2), var(--surface)); border-radius: 22px; padding: 20px;
  display: grid; gap: 12px; align-content: start; min-width: 0;
  box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 18px 40px -20px rgba(0,0,0,.8);
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > input { flex: 1 1 140px; }
.games { display: grid; gap: 8px; }
.game-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--bg-2); border-radius: 16px; padding: 10px 12px; }
.code { font-family: var(--display); font-weight: 900; letter-spacing: .12em; }
.chip { display: inline-block; background: var(--bg-2); border-radius: 999px; padding: 4px 12px; font-family: var(--display); font-weight: 900; letter-spacing: .12em; color: var(--mango); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; counter-reset: step; }
.step { background: var(--bg-2); border-radius: 18px; padding: 14px 16px; display: grid; gap: 4px; counter-increment: step; }
.step::before { content: counter(step); font-family: var(--display); font-weight: 900; font-size: 28px; color: var(--mango); line-height: 1; }
.step b { font-family: var(--display); font-weight: 800; }
.step span { color: var(--muted); font-size: 14px; }
.gallery { display: flex; gap: 14px; overflow-x: auto; padding: 8px 4px 16px; scroll-snap-type: x mandatory; }
.gallery .card { scroll-snap-align: start; cursor: default; }

/* ---------- cards ---------- */
.card {
  --c: #444; flex: 0 0 auto; width: var(--cw); aspect-ratio: 7 / 10; border-radius: 16px; padding: 6px;
  background: linear-gradient(170deg, #fffaf0, #f2dcb2);
  border: 0; display: flex; flex-direction: column; gap: 5px; text-align: center; color: var(--cocoa);
  position: relative; overflow: hidden; isolation: isolate;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.8), inset 0 -3px 0 rgba(120,70,20,.25), 0 10px 20px -8px rgba(0,0,0,.7);
  transition: transform .18s cubic-bezier(.2,.8,.2,1.2), box-shadow .18s;
}
.card::after {
  content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.55) 48%, transparent 60%);
  transform: translateX(-130%); transition: transform .6s ease;
}
.card:hover::after { transform: translateX(130%); }
.card .c-name {
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 80%, #fff 20%), var(--c));
  color: #fff; font: 900 11px/1.05 var(--display); text-transform: uppercase; letter-spacing: .03em;
  padding: 6px 4px 5px; border-radius: 11px 11px 5px 5px; text-shadow: 0 1px 0 rgba(0,0,0,.35);
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); min-height: 2.6em; display: grid; place-items: center;
}
.card .c-art { flex: 1; min-height: 0; border-radius: 6px; overflow: hidden; display: block; background: var(--c); box-shadow: inset 0 0 0 2px rgba(0,0,0,.18); position: relative; }
.card .c-art svg { width: 100%; height: 100%; display: block; }
.card .c-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .c-text { font-size: 10px; line-height: 1.18; font-weight: 800; padding: 1px 3px 3px; min-height: 3.6em; display: grid; place-items: center; }
.card.t-shield { background: linear-gradient(150deg, #fff6c8, #ffc94a 40%, #fff1a8 55%, #d99a1a); }
.card.t-shield .c-name { background: linear-gradient(180deg, #3fcf7a, #1a8a48); }
.card.t-jam { background: linear-gradient(170deg, #f6e8ff, #d9b8ec); }
.card.t-hole { background: linear-gradient(170deg, #4a120b, #1f0604); color: var(--cream); animation: danger 1.6s ease-in-out infinite; }
.card.t-hole .c-name { background: linear-gradient(180deg, #ff6a4d, #c41f0e); }
@keyframes danger { 50% { box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 0 26px -2px #ff4a2a; } }
.hand .card, .peek .card { cursor: pointer; }
.hand .card:hover { transform: translateY(-14px) rotate(0deg) scale(1.04); z-index: 5; }
.card.sel { transform: translateY(-26px) scale(1.06) !important; z-index: 6; box-shadow: 0 0 0 4px var(--mango), 0 18px 34px -10px var(--mango); }
.card.fly { animation: fly .45s cubic-bezier(.2,.8,.2,1.1); }
@keyframes fly { from { transform: translateY(-120px) rotate(-25deg) scale(.6); opacity: 0; } }

/* card back */
.back { width: var(--cw); aspect-ratio: 7 / 10; border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 10px 20px -8px rgba(0,0,0,.7); }
.back svg { width: 100%; height: 100%; display: block; }

/* ---------- table ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar .logo { font-size: 26px; }
.topbar .logo span:first-child { font-size: .55em; }
.seats { display: flex; gap: 10px; flex-wrap: wrap; }
.seat {
  display: flex; gap: 10px; align-items: center; padding: 6px 14px 6px 6px; border-radius: 999px;
  background: var(--surface); position: relative; min-width: 0;
  box-shadow: inset 0 0 0 2px var(--line);
}
.seat .ava { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-2); display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; }
.seat .nm { font-family: var(--display); font-weight: 800; overflow-wrap: anywhere; line-height: 1.1; }
.seat .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seat.turn { box-shadow: inset 0 0 0 3px var(--mango), 0 0 26px -6px var(--mango); }
.seat.turn .ava { animation: bob 1.4s ease-in-out infinite; }
.seat.out { opacity: .45; }
.seat.out .ava { filter: grayscale(1); }
.seat .kick { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--bg); color: var(--muted); font-size: 11px; box-shadow: inset 0 0 0 1px var(--line); }
.arena-wrap { margin-bottom: 8px; display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; }
@media (max-width: 860px) { .arena-wrap { grid-template-columns: 1fr; } .log { max-height: 132px; } }
.arena {
  border-radius: 28px; padding: 20px; display: grid; gap: 16px; min-width: 0; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 60% at 50% 45%, #1f6a54 0%, #154a3d 55%, #0f3a30 100%);
  box-shadow: inset 0 0 0 6px #5a3a1c, inset 0 0 0 9px #3d2610, inset 0 0 60px rgba(0,0,0,.5), 0 24px 50px -24px rgba(0,0,0,.9);
}
.banner { text-align: center; font-family: var(--display); font-weight: 900; font-size: clamp(17px, 3vw, 22px); text-shadow: 0 2px 0 rgba(0,0,0,.4); }
.banner.me { color: var(--mango); }
.banner small { display: block; font-family: var(--body); font-size: 13px; color: var(--muted); font-weight: 700; text-shadow: none; }
.piles { display: flex; gap: clamp(18px, 5vw, 46px); align-items: center; justify-content: center; flex-wrap: wrap; }
.pile-box { display: grid; gap: 8px; justify-items: center; }
.deckpile { position: relative; border: 0; padding: 0; background: none; border-radius: 16px; }
.deckpile .back { position: relative; z-index: 2; }
.deckpile::before, .deckpile::after {
  content: ""; position: absolute; inset: 0; border-radius: 16px; background: #0b2b24; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
}
.deckpile::before { transform: translate(6px, 6px) rotate(2deg); }
.deckpile::after { transform: translate(12px, 11px) rotate(4deg); background: #082019; }
.deckpile .count {
  position: absolute; z-index: 3; top: -12px; right: -12px; min-width: 44px; height: 44px; border-radius: 22px; padding: 0 8px;
  display: grid; place-items: center; background: var(--cream); color: var(--cocoa);
  font-family: var(--display); font-weight: 900; font-size: 18px; box-shadow: 0 4px 0 rgba(0,0,0,.35);
}
.deckpile.can { cursor: pointer; }
.deckpile.can .back { box-shadow: 0 0 0 4px var(--mango), 0 0 40px -4px var(--mango); animation: nudge 1.6s ease-in-out infinite; }
.deckpile.can:hover .back { transform: translateY(-6px) rotate(-2deg); }
@keyframes nudge { 50% { transform: translateY(-5px); } }
.slot { width: var(--cw); aspect-ratio: 7 / 10; border-radius: 16px; border: 3px dashed rgba(255,255,255,.18); display: grid; place-items: center; color: var(--muted); }
.fuse { display: grid; gap: 6px; max-width: 460px; width: 100%; justify-self: center; }
.fuse .bar { height: 12px; border-radius: 6px; background: rgba(0,0,0,.35); position: relative; box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
.fuse .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: linear-gradient(90deg, #ffd25a, #ff7a2a, #ff3b2a); transition: width .5s; }
.fuse .bar b { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: radial-gradient(circle, #fff6c8 20%, #ffb02e 50%, transparent 72%); animation: spark .3s linear infinite alternate; transition: left .5s; }
@keyframes spark { to { transform: scale(1.5); } }
.fuse .txt { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fuse .txt strong { color: #ffb4a8; }
.pending {
  display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap;
  background: rgba(0,0,0,.28); border-radius: 20px; padding: 12px 16px;
}
.pending .card { --cw: 92px; }
.pending .card .c-text { display: none; }
.pending .info { display: grid; gap: 4px; min-width: 0; max-width: 260px; }
.pending .info b { font-family: var(--display); font-weight: 900; }
.ring { width: 52px; height: 52px; flex: 0 0 auto; }
.ring circle { fill: none; stroke-width: 6; }
.stamp {
  position: absolute; z-index: 3; inset: 30% -10% auto; text-align: center; transform: rotate(-18deg);
  font-family: var(--display); font-weight: 900; font-size: 20px; color: #ff3b2a; letter-spacing: .1em;
  border: 3px solid #ff3b2a; border-radius: 8px; background: rgba(255,243,220,.85); padding: 2px 0;
}
.peek { display: grid; gap: 8px; justify-items: center; }
.peek .cards { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.peek .card { --cw: 96px; cursor: default; }
.peek .card .c-text { display: none; }
.peek .order { font-family: var(--display); font-size: 11px; color: var(--muted); text-align: center; }
.place { display: grid; gap: 12px; background: rgba(60,8,4,.55); border-radius: 20px; padding: 16px; box-shadow: inset 0 0 0 2px var(--coral); }
.place b { font-family: var(--display); }
.place input[type=range] { width: 100%; padding: 0; accent-color: var(--mango); border: 0; background: none; }
.winner { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 18px 0; }
.winner svg { width: 150px; height: 150px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
.winner h2 { font-size: clamp(28px, 6vw, 46px); color: var(--mango); text-shadow: 0 3px 0 #8a4d00; }
.log { background: var(--surface); border-radius: 22px; padding: 16px; display: grid; gap: 8px; align-content: start; max-height: 470px; overflow-y: auto; min-width: 0; }
.log div { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; padding-left: 12px; position: relative; }
.log div::before { content: ""; position: absolute; left: 0; top: .55em; width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.log div:first-of-type { color: var(--ink); }
.log div:first-of-type::before { background: var(--mango); }

/* hand dock */
.dock { position: relative; z-index: 4; display: grid; gap: 6px; background: var(--surface); border-radius: 22px; padding: 12px 14px 0; }
@media (min-height: 940px) and (min-width: 861px) {
  .dock { position: sticky; bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -16px 40px -10px rgba(0,0,0,.7); }
}
.dock-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 48px; }
.hand { display: flex; justify-content: center; padding: 34px 20px 22px; overflow-x: auto; overflow-y: visible; }
.hand .card { margin-left: calc(var(--cw) * -0.22); transform: rotate(calc(var(--off) * 3deg)) translateY(calc(var(--off2) * 2px)); transform-origin: 50% 120%; }
.hand .card:first-child { margin-left: 0; }
.out-note { text-align: center; padding: 14px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--cream); color: var(--cocoa); border-radius: 16px; padding: 12px 18px; max-width: calc(100% - 32px);
  font-weight: 800; box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 20px 40px rgba(0,0,0,.5); z-index: 30;
}
.conn { font-size: 12px; color: var(--coral); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }
.boomtext {
  position: fixed; left: 50%; top: 40%; z-index: 26; pointer-events: none; transform: translate(-50%, -50%);
  font-family: var(--display); font-weight: 900; font-size: clamp(56px, 14vw, 140px); color: var(--mango);
  text-shadow: 0 6px 0 #8a1d00, 0 12px 30px rgba(0,0,0,.6); animation: boomtext 1.3s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes boomtext { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.15) rotate(4deg); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -60%) scale(1) rotate(-2deg); opacity: 0; } }
.shake { animation: shake .5s; }
@keyframes shake { 20% { transform: translate(-8px, 4px); } 40% { transform: translate(7px, -5px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(4px, 3px); } }

.ava-pick { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; text-align: left; justify-self: stretch; }
.ava-side { display: grid; gap: 8px; justify-items: center; flex: 0 0 auto; }
.ava-big { width: 112px; height: 112px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 4px var(--mango), 0 10px 24px -8px rgba(0,0,0,.7); }
.ava-big svg, .ava-btn svg, .seat .ava svg, .win-ava svg { width: 100%; height: 100%; display: block; margin: 0; }
.ava-side .btn { padding: 8px 12px; font-size: 13px; }
.ava-opts { display: grid; gap: 8px; min-width: 0; flex: 1 1 240px; }
.ava-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.ava-tab { border: 0; border-radius: 999px; padding: 6px 12px; background: var(--bg-2); color: var(--muted); font-weight: 800; font-size: 13px; }
.ava-tab.on { background: var(--mango); color: var(--cocoa); }
.ava-row { display: flex; gap: 6px; flex-wrap: wrap; }
.ava-btn { width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0; overflow: hidden; box-shadow: inset 0 0 0 2px var(--line); transition: transform .1s; }
.ava-btn:hover { transform: scale(1.1); }
.ava-btn.on { box-shadow: 0 0 0 3px var(--mango); }
.win-ava { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 6px var(--mango), 0 0 50px -6px var(--mango); animation: bob 1.6s ease-in-out infinite; }
.card.t-mini { background: linear-gradient(170deg, #fff0d8, #ffc48a); }
.reacts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.rbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--surface); font-size: 20px; line-height: 1; box-shadow: 0 3px 0 rgba(0,0,0,.3); transition: transform .1s; }

  quick:   { name: "Быстрая",      desc: "Колода вдвое меньше, на руках 4 карты. Партия минут на пять.", hand: 4, mult: .5, holes: 0, shields: 0, minis: 1 },

  y: ["round", "sleepy", "sparkle", "heart", "wink"],

}

}
function setMode(s, id, mode) {
  if (s.host !== id) fail("Режим выбирает создатель игры");
  if (s.status !== "lobby") fail("Режим меняется только до старта");

  if (s.phase === "placing") fail("Сначала спрячь взрывного лемура");

  addLog(s, nm(s, id) + (toBottom ? " отправляет верхнюю карту на дно" : " оставляет верхнюю карту на месте"));
  s.phase = "normal"; s.shaman = null;
}
function giveMango(s, id) {
  requireTurn(s, id);
  const p = P(s, id), mate = partner(s, id);
  if (!mate) fail("Передавать манго можно только в командном режиме");
  if (!mate.alive) fail("Напарник уже выбыл");
  const sh = p.hand.find(c => c.t === "shield") || fail("У тебя нет манго");
  mate.hand.push(takeFromHand(p, sh.id));
  addLog(s, p.name + " передаёт манго напарнику " + mate.name);
}
function drawCard(s, id, bottom = false, rnd = Math.random) {
  const p = P(s, id);
  if (!s.deck.length) fail("Колода пуста");
  const card = bottom ? s.deck.pop() : s.deck.shift();
  if (!bottom) s.peek = null;
  s.drawSeq = (s.drawSeq || 0) + 1;
  const mark = res => { s.lastDraw = { n: s.drawSeq, by: id, t: card.t, res }; };
  if (card.t === "hole") {
    const sh = p.hand.find(c => c.t === "shield");
    if (sh) {
      takeFromHand(p, sh.id); s.discard.push(sh);
      s.phase = "placing"; s.placing = card; s.peek = null;
      mark("saved");
      addLog(s, p.name + " вытягивает взрывного лемура, но успокаивает его манго!");
    } else {
      s.discard.push(card);
      mark("boom");
      eliminate(s, id, " — БАБАХ! Взрывной лемур");
    }
    return card;
  }
  if (card.t === "mini") {
    s.discard.push(card);
    const lose = Math.ceil(p.hand.length / 2);
    for (let i = 0; i < lose; i++) s.discard.push(p.hand.splice(Math.floor(rnd() * p.hand.length), 1)[0]);
    mark("mini");
    addLog(s, "ХЛОП! " + p.name + " теряет " + lose + " карт(ы)");
    endTurn(s);
    return card;
  }
  p.hand.push(card);
  mark("safe");
  addLog(s, p.name + (bottom ? " берёт карту со дна" : " берёт карту"));
  endTurn(s);
  return card;
}
function draw(s, id) { requireTurn(s, id); return drawCard(s, id, false); }
function place(s, id, pos) {
  if (s.status !== "play" || s.phase !== "placing" || curId(s) !== id) fail("Сейчас нечего прятать");
  pos = Math.max(0, Math.min(s.deck.length, pos | 0));
  s.deck.splice(pos, 0, s.placing);
  s.placing = null; s.phase = "normal";
  addLog(s, nm(s, id) + " тихонько прячет лемура обратно в колоду");
  endTurn(s);
}
function backToLobby(s, id) {
  if (s.host !== id) fail("Только создатель игры может начать заново");
  Object.assign(s, { status: "lobby", winner: null, winTeam: null, pending: null, phase: "normal", placing: null, peek: null, spy: null, shaman: null, boardPick: null, lastDraw: null, lastSteal: null });
  for (const p of s.players) { p.alive = true; p.hand = []; delete p.team; }
  addLog(s, "Новая вечеринка — ждём старта");
}
</script>

  const arms = {
    sit: paw(45, 98) + paw(75, 98),

    hold: paw(50, 94) + paw(70, 94),
    head: "",
  }[pose];
  const head = `

    <ellipse cx="60" cy="76" rx="22" ry="14" fill="${FUR.cream}"/>
    <path d="M56 20 Q60 16 64 20 L66 64 L54 64 Z" fill="#fff4e0"/>
    ${o.mask ? `<rect x="20" y="36" width="80" height="26" rx="13" fill="#1b1b2b"/><path d="M22 46 L6 38 L9 54Z M98 46 L114 38 L111 54Z" fill="#1b1b2b"/>` : ""}
    ${eyeSVG(42, eyeMood)}${eyeSVG(78, eyeMood)}
    <path d="M54 64 Q60 60 66 64 Q63 70 60 70 Q57 70 54 64Z" fill="#e57a8a"/>
    ${mood === "happy" || mood === "party" ? `<ellipse cx="32" cy="72" rx="7" ry="4" fill="#ff8a7a" opacity=".6"/><ellipse cx="88" cy="72" rx="7" ry="4" fill="#ff8a7a" opacity=".6"/>` : ""}
    ${mouthSVG(mood === "wow" ? "scared" : mood)}`;
  const order = pose === "up" ? tail + arms + body + head : tail + body + head + arms;
  return `<g transform="${o.at || ""}" ${o.filter ? `filter="url(#${o.filter})"` : ""}>${o.behind || ""}${order}${o.extra || ""}</g>`;
}

  y: { round: "Круглые", sleepy: "Сонные", sparkle: "Звёздочки", heart: "Влюблённые", wink: "Подмигивает" },
  m: { smile: "Улыбка", grin: "Ухмылка с зубом", tongue: "Язык", smirk: "Хитрая", o: "Удивлён", cat: "Котик :3" },
  g: { none: "Без очков", sun: "Тёмные очки", round: "Круглые очки", heart: "Очки-сердечки", monocle: "Монокль", patch: "Повязка", star: "Очки-звёзды" },

const heartPath = (x, y, s, fill, extra = "") => `<path d="M${x} ${y + s * .9} C ${x - s * 1.7} ${y - s * .2}, ${x - s * .6} ${y - s * 1.4}, ${x} ${y - s * .4} C ${x + s * .6} ${y - s * 1.4}, ${x + s * 1.7} ${y - s * .2}, ${x} ${y + s * .9}Z" fill="${fill}" ${extra}/>`;
const starPath = (x, y, r, fill, extra = "") => `<polygon points="${Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; return `${(x + Math.cos(a) * rr).toFixed(1)},${(y + Math.sin(a) * rr).toFixed(1)}`; }).join(" ")}" fill="${fill}" ${extra}/>`;

Object.assign(HATS, {
  cowboy: `<ellipse cx="60" cy="24" rx="50" ry="9" fill="#8a5a2a"/><path d="M34 24 Q 34 -4 50 -2 Q 60 4 70 -2 Q 86 -4 86 24Z" fill="#a8703a"/><rect x="34" y="14" width="52" height="6" fill="#5a3a1c"/>`,

  halo: `<ellipse cx="60" cy="-2" rx="24" ry="7" fill="none" stroke="#ffe14d" stroke-width="5"/><ellipse cx="60" cy="-2" rx="24" ry="7" fill="none" stroke="#fff6c8" stroke-width="1.5"/>`,
  banana: `<path d="M30 16 Q 60 -18 92 14 Q 86 14 82 10 Q 60 -6 36 18Z" fill="#ffd84a" stroke="#b88a00" stroke-width="1.5"/><path d="M90 14 l6 -4" stroke="#6b4a00" stroke-width="3" stroke-linecap="round"/>`,
  propeller: `<path d="M34 28 Q 34 2 60 2 Q 86 2 86 28Z" fill="#e2304a"/><path d="M47 28 Q 47 2 60 2 Q 73 2 73 28Z" fill="#ffd84a"/><path d="M57 28 Q 57 2 60 2 Q 63 2 63 28Z" fill="#2b72c9"/><rect x="58.5" y="-6" width="3" height="9" fill="#555"/><ellipse cx="48" cy="-7" rx="12" ry="3" fill="#3fd0ff"/><ellipse cx="72" cy="-7" rx="12" ry="3" fill="#ff4f86"/><circle cx="60" cy="-7" r="3" fill="#555"/>`,
});
Object.assign(HAT_NAMES, { cowboy: "Ковбойская шляпа", chef: "Колпак повара", viking: "Шлем викинга", halo: "Нимб", banana: "Банан", propeller: "Кепка с пропеллером" });

function avatarSVG(raw) {
  const a = cleanAva(raw);
  const tint = a.c ? `filter="url(#af${a.c})"` : "";
  const ir = `ir${a.e}`, [i0, i1, i2] = IRIS[a.e];
  const fur = (inner) => `<g ${tint}>${inner}</g>`;
  const eye = (x, closed) => {
    if (closed || a.y === "wink" && x > 60) return `<path d="M${x - 12} 52 Q ${x} 44 ${x + 12} 52" stroke="#2a1708" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
    if (a.y === "heart") return heartPath(x, 50, 12, "#ff4f86", `stroke="#a0123a" stroke-width="2"`) + `<circle cx="${x - 5}" cy="45" r="3" fill="#fff" opacity=".8"/>`;
    let out = `<circle cx="${x}" cy="50" r="17" fill="#2a1708"/><circle cx="${x}" cy="50" r="14" fill="url(#${ir})"/><circle cx="${x}" cy="51" r="${a.y === "sparkle" ? 10 : 9}" fill="#120802"/>`;
    out += a.y === "sparkle"
      ? starPath(x - 4, 45, 5.5, "#fff") + starPath(x + 5, 56, 2.5, "#fff")
      : `<ellipse cx="${x - 5}" cy="44" rx="4.6" ry="3.8" fill="#fff"/><circle cx="${x + 5}" cy="56" r="1.8" fill="#fff" opacity=".9"/>`;
    if (a.y === "sleepy") out += fur(`<path d="M${x - 18} 52 Q ${x} 46 ${x + 18} 52 L${x + 18} 30 L${x - 18} 30Z" fill="${FUR.base}"/>`) + `<path d="M${x - 16} 51 Q ${x} 46 ${x + 16} 51" stroke="#2a1708" stroke-width="2.6" fill="none"/>`;
    return out;
  };
  const pattern = {
    none: "",
    stripes: `<path d="M44 26 Q 50 34 46 42 M76 26 Q 70 34 74 42 M60 22 L60 18" stroke="${FUR.dark}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M30 40 Q 26 46 28 54 M90 40 Q 94 46 92 54" stroke="${FUR.dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    spots: `<ellipse cx="34" cy="34" rx="7" ry="5" fill="${FUR.dark}" opacity=".8"/><ellipse cx="88" cy="40" rx="6" ry="8" fill="${FUR.dark}" opacity=".8"/><ellipse cx="74" cy="26" rx="4" ry="3" fill="${FUR.dark}" opacity=".8"/>`,
    freckles: [[30, 68], [35, 72], [29, 74], [90, 68], [85, 72], [91, 74]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.8" fill="${FUR.dark}"/>`).join(""),
    rings: `<ellipse cx="42" cy="50" rx="22" ry="21" fill="#fff4e0"/><ellipse cx="78" cy="50" rx="22" ry="21" fill="#fff4e0"/>`,
  }[a.p];
  const mouth = {
    smile: `<path d="M48 73 Q60 90 72 73 Q60 78 48 73Z" fill="#5a1d14"/><path d="M54 79 Q60 85 66 79 Q60 81 54 79Z" fill="#ff8a8a"/>`,
    grin: `<path d="M44 72 Q60 94 76 72 Q60 78 44 72Z" fill="#5a1d14"/><rect x="55" y="74" width="10" height="7" rx="1.5" fill="#fff"/>`,
    tongue: `<path d="M48 73 Q60 86 72 73 Q60 77 48 73Z" fill="#5a1d14"/><path d="M54 78 Q54 92 60 92 Q66 92 66 78Z" fill="#ff6a8a" stroke="#c43a5a" stroke-width="1.2"/><path d="M60 80 L60 89" stroke="#c43a5a" stroke-width="1.2"/>`,
    smirk: `<path d="M48 78 Q62 84 72 72" stroke="#5a1d14" stroke-width="3.2" fill="none" stroke-linecap="round"/>`,
    o: `<ellipse cx="60" cy="79" rx="5.5" ry="7" fill="#5a1d14"/><ellipse cx="60" cy="82" rx="3" ry="2.5" fill="#ff8a8a"/>`,
    cat: `<path d="M49 75 Q54.5 82 60 75 Q65.5 82 71 75" stroke="#5a1d14" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  }[a.m];
  const glasses = {
    none: "",
    sun: `<rect x="22" y="38" width="34" height="22" rx="8" fill="#141418"/><rect x="64" y="38" width="34" height="22" rx="8" fill="#141418"/><path d="M56 46 Q60 42 64 46" stroke="#141418" stroke-width="3" fill="none"/><path d="M27 44 l10 0 M69 44 l10 0" stroke="#fff" stroke-width="2.5" opacity=".5" stroke-linecap="round"/><path d="M22 44 L12 40 M98 44 L108 40" stroke="#141418" stroke-width="3"/>`,
    round: `<circle cx="42" cy="50" r="19" fill="#bfe4ff" fill-opacity=".18" stroke="#3a2410" stroke-width="3"/><circle cx="78" cy="50" r="19" fill="#bfe4ff" fill-opacity=".18" stroke="#3a2410" stroke-width="3"/><path d="M61 48 Q60 44 59 48" stroke="#3a2410" stroke-width="3" fill="none"/>`,
    heart: heartPath(42, 50, 15, "#ff4f86", `opacity=".85" stroke="#a0123a" stroke-width="2"`) + heartPath(78, 50, 15, "#ff4f86", `opacity=".85" stroke="#a0123a" stroke-width="2"`) + `<path d="M56 46 L64 46" stroke="#a0123a" stroke-width="3"/>`,
    monocle: `<circle cx="78" cy="50" r="19" fill="#bfe4ff" fill-opacity=".2" stroke="#d9b24a" stroke-width="3.5"/><path d="M92 62 Q 100 80 90 96" stroke="#d9b24a" stroke-width="1.5" fill="none"/>`,
    patch: `<ellipse cx="42" cy="50" rx="18" ry="17" fill="#141418"/><path d="M24 40 L96 28 M26 58 L12 64" stroke="#141418" stroke-width="3"/>`,
    star: starPath(42, 50, 22, "#ffe14d", `opacity=".85" stroke="#b88a00" stroke-width="2"`) + starPath(78, 50, 22, "#ffe14d", `opacity=".85" stroke="#b88a00" stroke-width="2"`),
  }[a.g];
  return `<svg viewBox="2 -14 116 116" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>
      <radialGradient id="furg" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="${FUR.light}"/><stop offset=".7" stop-color="${FUR.base}"/><stop offset="1" stop-color="${FUR.dark}"/></radialGradient>
      <radialGradient id="${ir}" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="${i0}"/><stop offset=".7" stop-color="${i1}"/><stop offset="1" stop-color="${i2}"/></radialGradient>
      ${a.c ? `<filter id="af${a.c}"><feColorMatrix type="hueRotate" values="${AVA_COLORS[a.c]}"/></filter>` : ""}</defs>
    <rect x="-10" y="-20" width="140" height="140" fill="${AVA_BG[a.b]}"/><circle cx="60" cy="40" r="56" fill="#fff" opacity=".07"/>
    ${fur(`<ellipse cx="22" cy="28" rx="17" ry="19" fill="${FUR.dark}"/><ellipse cx="98" cy="28" rx="17" ry="19" fill="${FUR.dark}"/>
      <ellipse cx="22" cy="29" rx="10" ry="12" fill="#f4b9a0"/><ellipse cx="98" cy="29" rx="10" ry="12" fill="#f4b9a0"/>
      <path d="M22 60 Q 18 22 60 18 Q 102 22 98 60 Q 98 96 60 96 Q 22 96 22 60Z" fill="url(#furg)"/>
      <path d="M24 58 l-8 4 l8 2 M96 58 l8 4 l-8 2" stroke="${FUR.dark}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      ${pattern}
      <ellipse cx="60" cy="76" rx="22" ry="14" fill="${FUR.cream}"/>
      <path d="M56 20 Q60 16 64 20 L66 64 L54 64 Z" fill="#fff4e0"/>`)}
    ${eye(42)}${eye(78)}
    <path d="M54 64 Q60 60 66 64 Q63 70 60 70 Q57 70 54 64Z" fill="#e57a8a"/>
    ${a.y === "heart" || a.m === "tongue" || a.m === "cat" ? `<ellipse cx="30" cy="72" rx="7" ry="4" fill="#ff8a7a" opacity=".6"/><ellipse cx="90" cy="72" rx="7" ry="4" fill="#ff8a7a" opacity=".6"/>` : ""}
    ${mouth}${glasses}${HATS[a.h] || ""}
  </svg>`;
}

function backSVG() {
  return `<svg viewBox="0 0 70 100" aria-hidden="true"><defs>
      <radialGradient id="bk" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#1f6a54"/><stop offset="1" stop-color="#0a2a22"/></radialGradient>
      <pattern id="bkp" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="7" cy="7" r="2.2" fill="#ffb22e" opacity=".22"/></pattern></defs>
    <rect width="70" height="100" fill="url(#bk)"/><rect width="70" height="100" fill="url(#bkp)"/>
    <rect x="4" y="4" width="62" height="92" rx="8" fill="none" stroke="#ffb22e" stroke-width="1.5" opacity=".7"/>
    <circle cx="35" cy="50" r="20" fill="#0a2a22" stroke="#ffb22e" stroke-width="2"/>
    <circle cx="28" cy="48" r="6" fill="#2a1708"/><circle cx="28" cy="48" r="4.6" fill="#f39a1e"/><circle cx="28" cy="48" r="2.6" fill="#120802"/><circle cx="26.6" cy="46.6" r="1.1" fill="#fff"/>
    <circle cx="42" cy="48" r="6" fill="#2a1708"/><circle cx="42" cy="48" r="4.6" fill="#f39a1e"/><circle cx="42" cy="48" r="2.6" fill="#120802"/><circle cx="40.6" cy="46.6" r="1.1" fill="#fff"/>
    <text x="35" y="64" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="900" font-size="6" fill="#ffb22e" letter-spacing=".6">БАБАХ</text>
  </svg>`;
}
</script>

<script>
// ---------- Network + UI ----------
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
let clockOffset = 0;
const now = () => Date.now() + clockOffset;

const me = {
  id: store.get("lemur-id") || (() => { const v = "p" + Math.random().toString(36).slice(2, 12); store.set("lemur-id", v); return v; })(),
  name: store.get("lemur-name") || "",
  ava: (() => { try { const a = JSON.parse(store.get("lemur-ava")); if (a) return cleanAva(a); } catch {} return randomAva(); })(),
};
let code = null, game = null, rev = 0, pollToken = 0, offline = false;
let ui = { sel: null, target: null, placePos: 0, placeInit: false };
let resolving = false, lastLogTop = null, lastTopCard = null, lastStatus = null;
let ART = {}; // card type -> picture url, from the cards/ folder
let seen = null, lastReactAt = 0; // what this view has already animated

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600);
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({}));
  if (data.now) clockOffset = data.now - Date.now();
  return { status: res.status, data };
}

// Every move: apply it to the latest state we know, save with that version; on a clash, refetch and retry.
let queue = Promise.resolve();
function mutate(fn) {
  const job = queue.then(() => mutateNow(fn));
  queue = job.catch(() => {});
  return job;
}
async function mutateNow(fn) {
  if (!code) return;
  let base = game, baseRev = rev;
  for (let attempt = 0; attempt < 8; attempt++) {
    if (!base) {
      const r = await api(`/api/game?code=${code}&since=-1`);
      base = r.data.state; baseRev = r.data.rev;
      if (!base) { toast("Игра не найдена"); return; }
    }
    const s = structuredClone(base);
    try { if (fn(s, now()) === false) return; }
    catch (e) { toast(e.message); return; }
    s.updatedAt = now();
    let r;
    try { r = await api("/api/save", { code, rev: baseRev, state: s }); }
    catch { toast("Нет связи с сервером"); return; }
    if (r.status === 200) { setGame(s, r.data.rev); return; }
    if (r.status === 409) { base = r.data.state; baseRev = r.data.rev; continue; }
    toast("Сервер не принял ход"); return;
  }
  toast("Слишком много одновременных ходов, попробуй ещё раз");
}
function setGame(s, r) {
  if (r <= rev && game) return;
  game = s; rev = r;
  if (!game || !game.players.some(p => p.id === me.id)) { exitGame(game ? null : "Игра не найдена"); return; }
  renderGame();
}
async function pollLoop(token) {
  while (token === pollToken) {
    try {
      const r = await api(`/api/game?code=${code}&since=${rev}`);
      if (token !== pollToken) return;
      if (offline) { offline = false; game && renderGame(); }
      if (r.data.rev !== rev) setGame(r.data.state, r.data.rev);
    } catch {
      if (token !== pollToken) return;
      if (!offline) { offline = true; game && renderGame(); }
      await sleep(1500);
    }
  }
}

function cardHTML(c, extra = "") {
  const d = CARDS[c.t];
  const photo = ART[c.t];
  const art = photo ? `<img src="${esc(photo)}" alt="">` : cardArt(c.t);
  return `<button class="card t-${c.t} ${extra}" style="--c:${d.c}${c.style || ""}" data-card="${c.id ?? ""}" aria-label="${esc(d.name)}: ${esc(d.text)}">
    <span class="c-name">${esc(d.name)}</span><span class="c-art">${art}</span><span class="c-text">${esc(d.text)}</span></button>`;
}
function avatar(p, i) { return avatarSVG(p?.ava || { c: i % AVA_COLORS.length }); }
const AVA_TABS = [
  { k: "fur", name: "Шерсть", groups: [["c", "Цвет"], ["p", "Узор"]] },
  { k: "eyes", name: "Глаза", groups: [["y", "Взгляд"], ["e", "Цвет глаз"]] },
  { k: "mouth", name: "Рот", groups: [["m", "Выражение"]] },
  { k: "glasses", name: "Очки", groups: [["g", "Очки и повязки"]] },
  { k: "hat", name: "Шапка", groups: [["h", "Головной убор"]] },
  { k: "bg", name: "Фон", groups: [["b", "Фон"]] },
];
let avaTab = "fur";
function optName(k, v) {
  if (k === "h") return HAT_NAMES[v];
  if (OPT_NAMES[k]) return OPT_NAMES[k][v];
  return { c: "Цвет шерсти ", e: "Цвет глаз ", b: "Фон " }[k] + (v + 1);
}
function avaPicker(raw) {
  const cur = cleanAva(raw);
  const tab = AVA_TABS.find(t => t.k === avaTab) || AVA_TABS[0];
  const groups = tab.groups.map(([k, label]) => {
    const o = AVA_OPTS[k], vals = typeof o === "number" ? Array.from({ length: o }, (_, n) => n) : o;
    return `<span class="label">${label}</span><div class="ava-row">${vals.map(v => `<button class="ava-btn ${cur[k] === v ? "on" : ""}" data-ava-k="${k}" data-ava-v="${v}" title="${esc(optName(k, v))}" aria-label="${esc(optName(k, v))}">${avatarSVG({ ...cur, [k]: v })}</button>`).join("")}</div>`;
  }).join("");
  return `<div class="ava-pick">
    <div class="ava-side"><div class="ava-big">${avatarSVG(cur)}</div><button class="btn ghost" data-ava-rand>🎲 Случайно</button></div>
    <div class="ava-opts"><div class="ava-tabs">${AVA_TABS.map(t => `<button class="ava-tab ${t.k === tab.k ? "on" : ""}" data-ava-tab="${t.k}">${t.name}</button>`).join("")}</div>${groups}</div></div>`;
}
function bindAva(rerender) {
  const save = () => {
    store.set("lemur-ava", JSON.stringify(me.ava));
    if (code) { const a = { ...me.ava }; mutate(s => setAva(s, me.id, a)); } else rerender();
  };
  $app.querySelectorAll("[data-ava-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.avaK, v = b.dataset.avaV;
    me.ava[k] = typeof AVA_OPTS[k] === "number" ? +v : v;
    save();
  });
  $app.querySelectorAll("[data-ava-rand]").forEach(b => b.onclick = () => { me.ava = randomAva(); save(); });
  $app.querySelectorAll("[data-ava-tab]").forEach(b => b.onclick = () => { avaTab = b.dataset.avaTab; rerender(); });
}

// ---------- Effects ----------
const fx = document.getElementById("fx"), fxc = fx.getContext("2d");
let parts = [], fxRunning = false;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function fxLoop() {
  fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio;
  fxc.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  fxc.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.life -= 1; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag; p.rot += p.vr;
    fxc.globalAlpha = Math.min(1, p.life / 30);
    fxc.fillStyle = p.color;
    if (p.ring) { fxc.strokeStyle = p.color; fxc.lineWidth = 6; fxc.beginPath(); fxc.arc(p.x, p.y, (90 - p.life) * 6, 0, 7); fxc.stroke(); continue; }
    fxc.save(); fxc.translate(p.x, p.y); fxc.rotate(p.rot);
    if (p.rect) fxc.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); else { fxc.beginPath(); fxc.arc(0, 0, p.r, 0, 7); fxc.fill(); }
    fxc.restore();
  }
  fxc.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(fxLoop); else { fxRunning = false; fxc.clearRect(0, 0, innerWidth, innerHeight); }
}
function startFx() { if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); } }
function boomFX() {
  if (reduced) return;
  const x = innerWidth / 2, y = innerHeight * .42;
  const cols = ["#ffd25a", "#ffb22e", "#ff7a2a", "#ff3b2a", "#fff6c8", "#5a3a1c"];
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 14;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .25, drag: .96, r: 3 + Math.random() * 7, color: cols[i % cols.length], life: 50 + Math.random() * 40, rot: 0, vr: 0 });
  }
  parts.push({ x, y, ring: true, color: "rgba(255,210,90,.6)", life: 90, vx: 0, vy: 0, g: 0, drag: 1, rot: 0, vr: 0 });
  startFx();
  const t = document.createElement("div"); t.className = "boomtext"; t.textContent = "БАБАХ!";
  document.body.appendChild(t); setTimeout(() => t.remove(), 1400);
  $app.classList.remove("shake"); void $app.offsetWidth; $app.classList.add("shake");
}
function confettiFX() {
  if (reduced) return;
  const cols = ["#ffb22e", "#ff4f86", "#7af0ff", "#b4ff6a", "#fff3dc", "#8a6cff"];
  for (let i = 0; i < 180; i++) {

// ---------- Sound: synthesized with Web Audio, no files ----------
const SFX = (() => {
  let ctx = null, muted = store.get("lemur-mute") === "1";
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  addEventListener("pointerdown", ac);
  function tone(f, t0, dur, type = "sine", vol = .2, f2) {
    const c = ctx, t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  function noise(t0, dur, vol, freq, type = "lowpass") {
    const c = ctx, t = c.currentTime + t0, len = Math.ceil(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = type; f.frequency.value = freq; g.gain.value = vol;
    src.connect(f).connect(g).connect(c.destination); src.start(t);
  }
  const sounds = {
    card() { noise(0, .14, .35, 2500, "highpass"); tone(420, 0, .1, "triangle", .08, 900); },
    tick() { tone(1500, 0, .03, "square", .04); },
    flip() { noise(0, .2, .25, 1400, "bandpass"); },
    safe() { tone(660, 0, .14, "triangle", .16); tone(990, .1, .25, "triangle", .16); },
    saved() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .07, .22, "triangle", .14)); },
    boom() { noise(0, 1.4, 1, 700); tone(130, 0, 1, "sine", .6, 28); },
    pop() { noise(0, .3, .7, 2600); tone(320, 0, .25, "square", .1, 70); },
    veto() { tone(190, 0, .22, "square", .12); tone(140, .13, .32, "square", .12); },
    blip() { tone(880, 0, .1, "sine", .14, 1400); },
    turn() { tone(880, 0, .16, "sine", .14); tone(1320, .13, .3, "sine", .12); },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .13, .28, "triangle", .16)); },
  };
  return {
    play(name) { if (muted) return; const c = ac(); if (!c) return; try { sounds[name](); } catch {} },
    get muted() { return muted; },
    toggle() { muted = !muted; store.set("lemur-mute", muted ? "1" : "0"); },
  };
})();

// ---------- Draw reveal, reactions, and change-driven effects ----------
function playDraw(s, ld) {
  const el = document.getElementById("drawfx");
  clearTimeout(playDraw.t1); clearTimeout(playDraw.t2); clearTimeout(playDraw.t3); clearInterval(playDraw.iv);
  const name = nm(s, ld.by), mine = ld.by === me.id, reveal = mine || ld.res !== "safe";
  el.className = ""; el.hidden = false;
  el.innerHTML = `<div class="dwrap"><div class="dcard ${reduced ? "" : "shake"}">
      <div class="dside dback"><div class="back">${backSVG()}</div></div>
      <div class="dside dface">${cardHTML({ t: ld.t })}</div></div>
    <div class="dcap">${esc(mine ? "Ты тянешь карту…" : name + " тянет карту…")}</div></div>`;
  el.onclick = () => { el.hidden = true; };
  const card = el.querySelector(".dcard"), cap = el.querySelector(".dcap");
  let k = 0;
  playDraw.iv = setInterval(() => { SFX.play("tick"); if (++k > 7) clearInterval(playDraw.iv); }, 110);
  playDraw.t1 = setTimeout(() => {
    clearInterval(playDraw.iv);
    card.classList.remove("shake");
    if (reveal) { card.classList.add("flip"); SFX.play("flip"); }
    const lines = {
      boom: [name + ": БАБАХ!", "boom"],
      saved: [(mine ? "Ты спасаешься" : name + " спасается") + " манго!", "saved"],
      mini: ["ХЛОП! " + (mine ? "Ты теряешь" : name + " теряет") + " карты", "pop"],
      safe: [mine ? "Фух, пронесло!" : name + ": фух, пронесло", "safe"],
    };
    const [txt, snd] = lines[ld.res] || lines.safe;
    playDraw.t3 = setTimeout(() => { cap.textContent = txt; el.classList.add(ld.res); SFX.play(snd); if (ld.res === "boom") boomFX(); }, reveal ? 380 : 0);
  }, reduced ? 100 : 950);
  playDraw.t2 = setTimeout(() => { el.hidden = true; }, reduced ? 1600 : 2900);
}
function bubble(pid, e) {
  const seat = document.querySelector(`.seat[data-pid="${CSS.escape(pid)}"]`);
  const r = seat ? seat.getBoundingClientRect() : { left: innerWidth / 2 - 28, top: innerHeight / 2 };
  const b = document.createElement("div");
  b.className = "bubble"; b.textContent = e;
  b.style.left = r.left + 28 + "px"; b.style.top = r.top - 6 + "px";
  document.body.appendChild(b); setTimeout(() => b.remove(), 1900);
  SFX.play("blip");
}
function reactsHTML() {
  return `<div class="reacts">${REACTIONS.map(e => `<button class="rbtn" data-react="${e}" aria-label="Реакция ${e}">${e}</button>`).join("")}
    <button class="rbtn mute" id="mute" aria-label="${SFX.muted ? "Включить звук" : "Выключить звук"}">${SFX.muted ? "🔇" : "🔊"}</button></div>`;
}
function effects(s, myTurn, win) {
  const first = !seen;
  if (first) seen = { react: {} };
  const ld = s.lastDraw;
  let drew = false;
  if (!first && ld && ld.n !== seen.draw) { playDraw(s, ld); drew = true; }
  seen.draw = ld?.n;
  const pk = s.pending ? s.pending.card.id + ":" + s.pending.jams.length : "";
  if (!first && s.pending && pk !== seen.pend) SFX.play(s.pending.jams.length ? "veto" : "card");
  seen.pend = pk;
  if (!first && myTurn && !seen.myTurn) setTimeout(() => SFX.play("turn"), drew ? 2300 : 0);
  seen.myTurn = myTurn;
  for (const [pid, r] of Object.entries(s.react || {})) {
    if (!first && seen.react[pid] !== r.n) bubble(pid, r.e);
    seen.react[pid] = r.n;
  }
  const st = s.lastSteal;
  if (!first && st && st.n !== seen.steal) {
    if (st.by === me.id) { toast("Ты утащил «" + CARDS[st.t].name + "» у " + nm(s, st.from)); SFX.play("saved"); }
    else if (st.from === me.id) { toast(nm(s, st.by) + " утащил у тебя «" + CARDS[st.t].name + "»"); SFX.play("veto"); }
  }
  seen.steal = st?.n;
  if (win && !first) setTimeout(() => { SFX.play("win"); confettiFX(); }, drew ? 2300 : 0);
}

function needName() {
  if (!me.name) { toast("Сначала напиши своё имя"); document.getElementById("nick")?.focus(); return false; }
  return true;
}
async function createGame() {
  if (!needName()) return;
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  for (let i = 0; i < 5; i++) {
    const c = Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join("");
    const s = newGame(c, me.id, me.name, now(), me.ava);
    try {
      const r = await api("/api/save", { code: c, rev: 0, state: s });
      if (r.status === 200) { enterGame(c, s, r.data.rev); return; }
      if (r.status !== 409) break;
    } catch { break; }
  }
  toast("Не получилось создать игру");
}
async function joinGame(c) {
  if (!needName() || !c) return;
  if (!/^[A-Z]{4}$/.test(c)) { toast("Код — 4 латинские буквы"); return; }
  let r;
  try { r = await api(`/api/game?code=${c}&since=-1`); } catch { toast("Нет связи с сервером"); return; }
  if (!r.data.state) { toast("Вечеринки с кодом " + c + " нет"); return; }
  code = c; game = r.data.state; rev = r.data.rev;
  await mutate(s => join(s, me.id, me.name, me.ava));
  if (game && game.players.some(p => p.id === me.id)) enterGame(c, game, rev);
  else code = null;
}
function enterGame(c, s, r) {
  store.set("lemur-game", c);
  code = c; game = s; rev = r;
  ui = { sel: null, target: null, placePos: 0, placeInit: false };
  lastLogTop = null; lastTopCard = null; lastStatus = null; seen = null;
  history.replaceState(null, "", "#" + c);
  renderGame();
  pollLoop(++pollToken);
}
function exitGame(note) {
  pollToken++; code = null; game = null; rev = 0;
  store.set("lemur-game", null);
  history.replaceState(null, "", location.pathname);
  renderLobby(note);
}

      <div class="piles">
        <div class="pile-box"><button class="deckpile ${canDraw ? "can" : ""}" id="deck" ${canDraw ? "" : "disabled"} aria-label="Взять карту из колоды, в ней ${s.deck.length}">
          <div class="back">${backSVG()}</div><span class="count">${s.deck.length}</span></button>
          <span class="label">${canDraw ? "Нажми, чтобы тянуть" : "Колода"}</span></div>
        <div class="pile-box">${top ? cardHTML({ ...top, id: "" }, topChanged ? "fly" : "") : `<div class="slot">сброс</div>`}<span class="label">Сброс</span></div>
      </div>
      <div class="fuse"><div class="bar"><i style="width:${pct}%"></i><b style="left:${pct}%"></b></div>
        <div class="txt"><span>Взрывных лемуров: <strong>${holes}</strong>${minis ? ` · хлопушек: <strong>${minis}</strong>` : ""}</span><span>Шанс взрыва: <strong>${pct}%</strong></span></div></div>
      ${pendHTML}${placeHTML}${shamanHTML}${boardHTML}${peek}${spyHTML}`;
  }

  let dock = "";
  if (my && s.status === "play") {
    if (!my.alive) dock = `<div class="dock"><div class="panel out-note"><b>Тебя взорвали 💥</b><span class="muted">Досмотри партию и поддержи друзей.</span></div></div>`;
    else {
      const selCard = my.hand.find(c => c.id === ui.sel);
      const canPlay = myTurn && !s.pending && s.phase === "normal";
      const targetsFor = t => s.players.filter(p => p.alive && p.id !== me.id && (t !== "board" || p.hand.length));
      let act = `<span class="muted">${canPlay ? "Выбери карту, чтобы сыграть её" : "Нажми на карту, чтобы рассмотреть"}</span>`;
      if (selCard) {
        const playable = canPlay && !UNPLAYABLE.includes(selCard.t);
        const targets = targetsFor(selCard.t);
        act = "";
        if (TARGETED.includes(selCard.t) && playable) {
          if (!targets.some(p => p.id === ui.target)) ui.target = targets[0]?.id || null;
          act = targets.length > 1
            ? `<span class="muted">У кого?</span>${targets.map(p => `<button class="tchip ${p.id === ui.target ? "on" : ""}" data-target="${esc(p.id)}">${esc(p.name)} · ${p.hand.length}</button>`).join("")}`
            : targets.length ? `<span class="muted">у ${esc(targets[0].name)}</span>` : "";
        }
        act += playable ? `<button class="btn primary" id="playBtn" ${TARGETED.includes(selCard.t) && !targets.length ? "disabled" : ""}>Сыграть «${esc(CARDS[selCard.t].name)}»</button>`
          : `<span class="muted">${selCard.t === "shield" ? "Манго сработает само, если вытянешь взрывного лемура" : selCard.t === "jam" ? "«Неть!» играется, когда кто-то сыграл карту" : "Сейчас её не сыграть"}</span>`;
      }
      const mate = partner(s, me.id);
      if (mate?.alive && canPlay && my.hand.some(c => c.t === "shield")) act += `<button class="btn" id="giveMango">🥭 Манго напарнику</button>`;
      const n = my.hand.length;
      dock = `<div class="dock"><div class="dock-head"><span class="label">Твои карты · ${n}</span><div class="actions">${act}</div></div>
        <div class="hand">${my.hand.map((c, i) => { const off = i - (n - 1) / 2; return cardHTML({ ...c, style: `;--off:${off};--off2:${Math.abs(off) ** 1.6}` }, c.id === ui.sel ? "sel" : ""); }).join("")}</div></div>`;
    }
  }

  $app.innerHTML = `
    <div class="topbar"><div class="logo"><span>Взрывные</span><span>лемуры</span></div>
      <div class="row">${offline ? `<span class="conn">Нет связи с сервером…</span>` : ""}<span class="chip">${esc(s.code)}</span>
      <button class="btn ghost" id="leave">${s.status === "play" && my?.alive ? "Сдаться" : "Выйти"}</button></div></div>
    <div class="seats">${seats}</div>${reactsHTML()}
    <div class="arena-wrap"><div class="arena">${arena}</div>
      <div class="log"><span class="label">Что происходит</span>${s.log.map(l => `<div>${esc(l)}</div>`).join("")}</div></div>
    ${dock}`;
  bindGame();
  tick();
  effects(s, myTurn, win);
}
function placeLabel(pos, n) {
  if (pos === 0) return "Самой верхней картой — следующий вытянет его!";
  if (pos === n) return "На самое дно";
  return `${pos + 1}-й сверху из ${n + 1}`;
}
function bindGame() {
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on("leave", async () => {
    const c = code;
    await mutate(s => leave(s, me.id));
    if (code === c) exitGame();
  });
  on("copyLink", async () => {
    const link = location.origin + location.pathname + "#" + game.code;
    try { await navigator.clipboard.writeText(link); toast("Ссылка скопирована"); } catch { toast(link); }
  });
  on("start", () => mutate(s => start(s, me.id)));
  on("again", () => mutate(s => backToLobby(s, me.id)));
  on("deck", () => mutate(s => { draw(s, me.id); }));
  on("jam", e => { const id = +e.currentTarget.dataset.id; mutate((s, t) => jam(s, me.id, id, t)); });
  on("playBtn", () => { const id = ui.sel, t = ui.target; ui.sel = null; mutate((s, n) => play(s, me.id, id, t, n)); });
  on("placeBtn", () => mutate(s => place(s, me.id, ui.placePos)));
  on("shamanKeep", () => mutate(s => shamanChoice(s, me.id, false)));
  on("shamanBottom", () => mutate(s => shamanChoice(s, me.id, true)));
  on("giveMango", () => mutate(s => giveMango(s, me.id)));
  $app.querySelectorAll("[data-target]").forEach(b => b.onclick = () => { ui.target = b.dataset.target; renderGame(); });
  $app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const k = +b.dataset.pick; mutate(s => boardTake(s, me.id, k)); });
  on("mute", () => { SFX.toggle(); renderGame(); });
  bindAva(renderGame);
  $app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => mutate(s => setMode(s, me.id, b.dataset.mode)));
  $app.querySelectorAll("[data-react]").forEach(b => b.onclick = () => {
    if (Date.now() - lastReactAt < 1000) return;
    lastReactAt = Date.now();
    const e = b.dataset.react;
    mutate(s => react(s, me.id, e));
  });
  const r = document.getElementById("placeRange");
  if (r) r.oninput = () => { ui.placePos = +r.value; document.getElementById("placeLbl").textContent = placeLabel(ui.placePos, game.deck.length); };
  const tg = document.getElementById("target");
  if (tg) tg.onchange = () => { ui.target = tg.value; };
  $app.querySelectorAll(".hand [data-card]").forEach(b => b.onclick = () => {
    const id = +b.dataset.card; ui.sel = ui.sel === id ? null : id; renderGame();
  });
  $app.querySelectorAll("[data-kick]").forEach(b => b.onclick = () => {
    if (game.host === me.id) mutate(s => eliminate(s, b.dataset.kick, " убран из игры"));
  });
}

// Countdown and resolution of a played card. Its player resolves it on time; anyone else steps in if they have gone quiet.
function tick() {
  const pd = game?.pending;
  const ring = document.getElementById("ring");
  if (pd && ring) ring.setAttribute("stroke-dashoffset", (138.2 * (1 - Math.min(1, Math.max(0, pd.deadline - now()) / WINDOW_MS))).toFixed(1));
  if (!pd || resolving || game.status !== "play") return;
  const grace = pd.by === me.id ? 0 : 3000;
  if (now() >= pd.deadline + grace) {
    resolving = true;
    const key = pd.card.id;
    mutate((s, t) => {
      if (!s.pending || s.pending.card.id !== key) return false;
      if (!resolve(s, t)) return false;
    }).finally(() => { resolving = false; });
  }
}
setInterval(tick, 150);

// ---------- Boot ----------
(async () => {
  try { ART = (await api("/api/art")).data.art || {}; } catch {}
  renderLobby();
  const fromLink = (location.hash.slice(1) || "").toUpperCase();
  const saved = store.get("lemur-game");
  const target = /^[A-Z]{4}$/.test(fromLink) ? fromLink : saved;
  if (target) {
    try {
      const r = await api(`/api/game?code=${target}&since=-1`);
      if (r.data.state?.players.some(p => p.id === me.id)) { enterGame(target, r.data.state, r.data.rev); return; }
      if (r.data.state && target === fromLink) {
        if (me.name) { joinGame(target); return; }
        document.getElementById("codeIn").value = target;
        toast("Напиши своё имя и нажми «Войти»");
        return;
      }
    } catch {}
    store.set("lemur-game", null);
  }
})();
</script>
